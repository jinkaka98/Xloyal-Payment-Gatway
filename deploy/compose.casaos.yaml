name: xloyal
services:
  postgres:
    image: postgres:17-alpine
    env_file: /DATA/AppData/xloyal/runtime.env
    volumes:
      - /DATA/AppData/xloyal/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xloyal -d xloyal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: /DATA/projects/xloyal/current, dockerfile: deploy/backend.Dockerfile, target: runtime }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/local/bin/migrate /migrations/000_bootstrap_core.sql
        for migration in /migrations/004_merchant_connector.sql /migrations/007_restore_admin_feature_schema.sql /migrations/005_browser_credentials.sql /migrations/006_worker_test_payment_columns.sql /migrations/008_merchant_history_backfill.sql; do
          /usr/local/bin/migrate "$$migration"
        done
    env_file: /DATA/AppData/xloyal/runtime.env
    volumes:
      - /DATA/projects/xloyal/current/backend/migrations:/migrations:ro
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: /DATA/projects/xloyal/current, dockerfile: deploy/backend.Dockerfile, target: runtime }
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      HTTP_ADDR: :8080
      GITHUB_WEBHOOK_SIGNAL_PATH: /run/xloyal/deploy-request
      CAMOUFOX_CHECKER_CMD: /usr/local/bin/neko-checker
      NEKO_CDP_URL: http://neko:9222
    volumes:
      - /DATA/AppData/xloyal/signals:/run/xloyal
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["0.0.0.0:1970:8080"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"], interval: 10s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  worker:
    build: { context: /DATA/projects/xloyal/current, dockerfile: deploy/backend.Dockerfile, target: runtime }
    entrypoint: ["/usr/local/bin/worker"]
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      CAMOUFOX_CHECKER_CMD: /usr/local/bin/neko-checker
      NEKO_CDP_URL: http://neko:9222
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped

  web:
    build:
      context: /DATA/projects/xloyal/current
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.alpakyros.net
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      INTERNAL_API_URL: http://api:8080
      PORT: "3000"
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  neko:
    build:
      context: /DATA/projects/xloyal/current
      dockerfile: deploy/neko.Dockerfile
    shm_size: 2gb
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      NEKO_DESKTOP_SCREEN: 1440x900@30
      NEKO_SESSION_COOKIE_ENABLED: "true"
      # CasaOS is also accessed over LAN HTTP. A Secure cookie cannot persist
      # there, so Neko would show the login form again after every submit.
      NEKO_SESSION_COOKIE_SECURE: "false"
      # Neko is mounted under /browser. Without this the login response scopes
      # the token to /browser/api and the /browser/ws WebSocket loses it.
      NEKO_SESSION_COOKIE_PATH: /browser
      NEKO_WEBRTC_ICELITE: "true"
      NEKO_WEBRTC_NAT1TO1: 192.168.1.20
      NEKO_WEBRTC_UDPMUX: "52000"
    volumes:
      - /DATA/AppData/xloyal/neko:/home/neko/.config/chromium
    ports: ["0.0.0.0:52000:52000/udp"]
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    volumes:
      - /DATA/projects/xloyal/current/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /DATA/projects/xloyal/current/deploy/nginx-global.conf:/etc/nginx/conf.d/00-global.conf:ro
    ports: ["0.0.0.0:5656:8080"]
    depends_on: { web: { condition: service_started }, neko: { condition: service_started } }
    restart: unless-stopped

x-casaos:
  architectures: [amd64]
  author: Xloyal
  category: Finance
  description:
    en_us: Xloyal QRIS payment operations console
  hostname: 192.168.1.20
  icon: /img/default.0a7cfbf2.svg
  index: /
  is_uncontrolled: false
  main: edge
  port_map: "5656"
  scheme: http
  store_app_id: xloyal
  title:
    en_us: Xloyal Payment Gateway
