name: xloyal
services:
  postgres:
    image: postgres:17-alpine
    env_file: /DATA/AppData/xloyal/runtime.env
    volumes:
      - /DATA/AppData/xloyal/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xloyal -d xloyal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: "${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}", dockerfile: deploy/backend.Dockerfile, target: runtime }
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/local/bin/migrate /migrations/000_bootstrap_core.sql
        for migration in /migrations/004_merchant_connector.sql /migrations/007_restore_admin_feature_schema.sql /migrations/005_browser_credentials.sql /migrations/006_worker_test_payment_columns.sql /migrations/008_merchant_history_backfill.sql /migrations/009_test_payment_unique_code.sql /migrations/010_tenant_qris_transactions.sql /migrations/011_tenant_api_key_ciphertext.sql /migrations/012_tenant_sandbox_mode.sql /migrations/013_transaction_sandbox_mode.sql /migrations/014_unique_amount_codes.sql /migrations/015_unique_amount_cooldown.sql /migrations/016_browser_job_queue.sql; do
          /usr/local/bin/migrate "$$migration"
        done
    env_file: /DATA/AppData/xloyal/runtime.env
    volumes:
      - ${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}/backend/migrations:/migrations:ro
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: "${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}", dockerfile: deploy/backend.Dockerfile, target: runtime }
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      HTTP_ADDR: :8080
      GITHUB_WEBHOOK_SIGNAL_PATH: /run/xloyal/deploy-request
      CAMOUFOX_CHECKER_CMD: /usr/local/bin/neko-checker
      NEKO_CDP_URL: http://neko:9222
      NEKO_HELPER_URL: http://neko:9224/sync
    volumes:
      - /DATA/AppData/xloyal/signals:/run/xloyal
    depends_on:
      migrate: { condition: service_completed_successfully }
      neko: { condition: service_healthy }
    ports: ["127.0.0.1:1970:8080"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"], interval: 10s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  worker:
    build: { context: "${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}", dockerfile: deploy/backend.Dockerfile, target: runtime }
    entrypoint: ["/usr/local/bin/worker"]
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      CAMOUFOX_CHECKER_CMD: /usr/local/bin/neko-checker
      NEKO_CDP_URL: http://neko:9222
      NEKO_HELPER_URL: http://neko:9224/sync
    depends_on:
      migrate: { condition: service_completed_successfully }
      neko: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.alpakyros.net
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      INTERNAL_API_URL: http://api:8080
      PORT: "3000"
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  neko:
    build:
      context: ${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}
      dockerfile: deploy/neko.Dockerfile
    shm_size: 2gb
    env_file: /DATA/AppData/xloyal/runtime.env
    environment:
      # The bundled Neko web client connects through the legacy WebSocket and
      # passes credentials in its query string.
      NEKO_LEGACY: "true"
      NEKO_IMPLICIT_CONTROL: "true"
      NEKO_SESSION_IMPLICIT_HOSTING: "true"
      NEKO_SESSION_LOCKED_CONTROLS: "false"
      NEKO_DESKTOP_SCREEN: 1440x900@30
      # Cookie auth conflicts with the bundled legacy client and produces
      # "token not found". The WebSocket authenticates with the entered Neko
      # password instead.
      NEKO_SESSION_COOKIE_ENABLED: "false"
      NEKO_SESSION_COOKIE_SECURE: "false"
      NEKO_WEBRTC_ICELITE: "true"
      NEKO_WEBRTC_NAT1TO1: 192.168.1.20
      NEKO_WEBRTC_UDPMUX: "52000"
    volumes:
      - /DATA/AppData/xloyal/neko:/home/neko/.config/chromium
    ports: ["0.0.0.0:52000:52000/udp"]
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${XLOYAL_RELEASE_DIR:-/DATA/projects/xloyal/current}/deploy/nginx-global.conf:/etc/nginx/conf.d/00-global.conf:ro
    ports: ["127.0.0.1:5656:8080"]
    depends_on: { web: { condition: service_started }, neko: { condition: service_started } }
    restart: unless-stopped

x-casaos:
  architectures: [amd64]
  author: Xloyal
  category: Finance
  description:
    en_us: Xloyal QRIS payment operations console
  hostname: 192.168.1.20
  icon: /img/default.0a7cfbf2.svg
  index: /
  is_uncontrolled: false
  main: edge
  port_map: "5656"
  scheme: http
  store_app_id: xloyal
  title:
    en_us: Xloyal Payment Gateway
