{
  "openapi": "3.1.0",
  "info": {
    "title": "Xloyal Payment Gateway API",
    "version": "0.1.0",
    "description": "Tenant-isolated QRIS invoice API and role-protected administration API. Browser calls require an Origin matching the tenant site_url unless sandbox_mode is enabled. API-key authentication remains mandatory in both modes; server-to-server calls without Origin are unaffected."
  },
  "servers": [{"url": "http://localhost:8080"}],
  "tags": [
    {"name": "Public"},
    {"name": "Admin"}
  ],
  "x-tenant-cors": {
    "preflight": "OPTIONS /v1/* returns 204 for a syntactically valid Origin; the authenticated request still enforces the tenant origin policy.",
    "allowMethods": ["GET", "POST", "OPTIONS"],
    "allowHeaders": ["Content-Type", "X-API-Key", "Idempotency-Key"],
    "allowCredentials": false
  },
  "paths": {
    "/v1/health": {
      "get": {
        "operationId": "health",
        "responses": {"200": {"description": "Healthy", "content": {"application/json": {"schema": {"type": "object", "required": ["status"], "properties": {"status": {"const": "ok"}}}}}}}
      }
    },
    "/v1/payment-sessions": {
      "post": {
        "tags": ["Public"],
        "operationId": "createPaymentSession",
        "security": [{"ApiKey": []}],
        "parameters": [{"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "maxLength": 200}, "description": "Reserved for retry correlation; one active session is permitted per tenant invoice."}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreatePaymentSession"}}}},
        "responses": {
          "201": {"description": "Payment session created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PaymentSession"}}}},
          "400": {"$ref": "#/components/responses/Problem"}, "401": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/v1/payment-sessions/{token}": {
      "get": {
        "tags": ["Public"], "operationId": "getPaymentSession",
        "parameters": [{"name": "token", "in": "path", "required": true, "schema": {"type": "string", "minLength": 32, "maxLength": 512}}],
        "responses": {"200": {"description": "Public payment session snapshot", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PaymentSession"}}}}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/payment-sessions/{token}/events": {
      "get": {
        "tags": ["Public"], "operationId": "paymentSessionEvents",
        "parameters": [
          {"name": "token", "in": "path", "required": true, "schema": {"type": "string", "minLength": 32, "maxLength": 512}},
          {"name": "after_sequence", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 0}, "description": "Resume events with sequence greater than this cursor."}
        ],
        "responses": {
          "200": {"description": "At-least-once public payment event stream", "content": {"text/event-stream": {"schema": {"type": "string", "example": "event: payment.paid\\nid: 3\\ndata: {\\\"event_id\\\":\\\"evt_opaque\\\",\\\"payment_session_id\\\":\\\"sess_opaque\\\",\\\"invoice_id\\\":\\\"inv_opaque\\\",\\\"status\\\":\\\"paid\\\",\\\"sequence\\\":3,\\\"occurred_at\\\":\\\"2026-08-18T00:02:00Z\\\"}\\n\\n"}}}},
          "400": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/v1/payment-sessions/{token}/cancel": {
      "post": {
        "tags": ["Public"], "operationId": "cancelPaymentSession",
        "parameters": [{"name": "token", "in": "path", "required": true, "schema": {"type": "string", "minLength": 32, "maxLength": 512}}],
        "responses": {
          "200": {"description": "Payment session cancelled or already cancelled", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PaymentSession"}}}},
          "404": {"$ref": "#/components/responses/Problem"}, "409": {"description": "Payment session reached a terminal state", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PaymentSessionConflict"}}}}
        }
      }
    },
    "/v1/tenants/{tenant_id}/invoices": {
      "post": {
        "tags": ["Public"],
        "operationId": "createInvoice",
        "security": [{"ApiKey": []}],
        "parameters": [
          {"$ref": "#/components/parameters/TenantId"},
          {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string"}, "description": "Used when IdempotencyKey is absent from the body."}
        ],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateInvoice"}}}},
        "responses": {
          "201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invoice"}}}},
          "200": {"description": "Existing idempotent invoice", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invoice"}}}},
          "400": {"$ref": "#/components/responses/Problem"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"},
          "409": {"$ref": "#/components/responses/Problem"}, "502": {"$ref": "#/components/responses/Problem"}
        }
      }
    },
    "/v1/tenants/{tenant_id}/transactions/refresh": {
      "post": {
        "tags": ["Public"], "operationId": "refreshTenantTransactions", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}],
        "responses": {"202": {"description": "Browser history refresh queued", "content": {"application/json": {"schema": {"type": "object", "required": ["status", "tenant_id", "merchant_id", "poll_url"], "properties": {"status": {"const": "queued"}, "tenant_id": {"type": "string"}, "merchant_id": {"type": "string"}, "poll_url": {"type": "string"}}}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/transactions": {
      "get": {
        "tags": ["Public"], "operationId": "listTenantTransactions", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 500, "default": 100}}],
        "responses": {"200": {"description": "Tenant QRIS requests and matched portal transactions", "content": {"application/json": {"schema": {"type": "array", "items": {"oneOf": [{"$ref": "#/components/schemas/PortalTransaction"}, {"$ref": "#/components/schemas/TenantQRISTransactionLog"}]}}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/transactions/qris": {
      "post": {
        "tags": ["Public"], "operationId": "createTenantQRISTransaction", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}, {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "maxLength": 200}}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateTenantQRIS"}}}},
        "responses": {"201": {"description": "QRIS transaction created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}, "200": {"description": "Existing idempotent QRIS transaction", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}, "400": {"$ref": "#/components/responses/Problem"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"$ref": "#/components/responses/Problem"}, "429": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/transactions/qris/{transaction_id}": {
      "get": {
        "tags": ["Public"], "operationId": "getTenantQRISTransaction", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}, {"name": "transaction_id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "QRIS transaction status", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/transactions/qris/{transaction_id}/cancel": {
      "post": {
        "tags": ["Public"], "operationId": "cancelTenantQRISTransaction", "security": [{"ApiKey": []}],
        "description": "Atomically cancel a pending tenant QRIS transaction. Repeated cancellation is idempotent. Paid, expired, or failed transactions return the current terminal transaction with HTTP 409.",
        "parameters": [{"$ref": "#/components/parameters/TenantId"}, {"name": "transaction_id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "Transaction cancelled or already cancelled", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"description": "Transaction already reached a non-cancellable terminal status", "content": {"application/json": {"schema": {"type": "object", "required": ["error", "transaction"], "properties": {"error": {"type": "string"}, "transaction": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}}}, "500": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/transactions/qris/{transaction_id}/qr": {
      "get": {
        "tags": ["Public"], "operationId": "tenantQRISTransactionImage", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}, {"name": "transaction_id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "QR code PNG", "content": {"image/png": {"schema": {"type": "string", "contentEncoding": "binary"}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}, "410": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/qris/templates": {
      "get": {
        "tags": ["Public"], "operationId": "listTenantQRSTemplates", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}],
        "responses": {"200": {"description": "Active static-to-dynamic QRIS templates accessible by this tenant. Use an item id as template_id when creating a QRIS transaction.", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/QRISTemplate"}}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/tenants/{tenant_id}/qris/dynamic": {
      "post": {
        "tags": ["Public"], "operationId": "createTenantDynamicQRIS", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantId"}, {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "maxLength": 200}}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateTenantQRIS"}}}},
        "responses": {"201": {"description": "QRIS transaction created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}, "200": {"description": "Existing idempotent QRIS transaction", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantQRISTransaction"}}}}, "400": {"$ref": "#/components/responses/Problem"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"$ref": "#/components/responses/Problem"}, "429": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/invoices/{invoice_id}": {
      "get": {
        "tags": ["Public"], "operationId": "getInvoice", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/InvoiceId"}],
        "responses": {"200": {"description": "Invoice", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invoice"}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/invoices/{invoice_id}/check": {
      "post": {
        "tags": ["Public"], "operationId": "checkInvoice", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/InvoiceId"}],
        "responses": {"200": {"description": "Updated invoice", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invoice"}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}, "429": {"$ref": "#/components/responses/Problem"}, "502": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/v1/invoices/{invoice_id}/qr": {
      "get": {
        "tags": ["Public"], "operationId": "invoiceQr", "security": [{"ApiKey": []}],
        "parameters": [{"$ref": "#/components/parameters/InvoiceId"}],
        "responses": {"200": {"description": "QR code PNG", "content": {"image/png": {"schema": {"type": "string", "contentEncoding": "binary"}}}}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/TenantOriginDenied"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/tenants": {
      "get": {
        "tags": ["Admin"], "operationId": "listTenants", "security": [{"AdminBearer": []}],
        "responses": {"200": {"description": "Tenants", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Tenant"}}}}}, "403": {"$ref": "#/components/responses/Problem"}}
      },
      "post": {
        "tags": ["Admin"], "operationId": "createTenant", "security": [{"AdminBearer": []}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateTenant"}}}},
        "responses": {"201": {"description": "Created; API key is returned once", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantCredential"}}}}, "400": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/tenants/{id}": {
      "put": {
        "tags": ["Admin"], "operationId": "updateTenant", "security": [{"AdminBearer": []}],
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateTenant"}}}},
        "responses": {"200": {"description": "Updated tenant", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Tenant"}}}}, "400": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}}
      },
      "delete": {
        "tags": ["Admin"], "operationId": "deleteTenant", "security": [{"AdminBearer": []}],
        "description": "Archive the tenant, revoke its API key, and preserve linked transaction history.",
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"204": {"description": "Tenant archived and API access revoked"}, "401": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}, "500": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/tenants/{id}/credentials": {
      "get": {
        "tags": ["Admin"], "operationId": "revealTenantCredential", "security": [{"AdminBearer": []}],
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "Decrypted tenant API key", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantCredentialReveal"}}}}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"description": "Legacy credential must be rotated", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Problem"}}}}}
      }
    },
    "/admin/tenants/{id}/credentials/rotate": {
      "post": {
        "tags": ["Admin"], "operationId": "rotateTenantCredential", "security": [{"AdminBearer": []}],
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "Rotated tenant API key", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TenantCredentialRotation"}}}}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}, "409": {"description": "Credential changed concurrently; reload before retrying", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Problem"}}}}}
      }
    },
    "/admin/merchant-accounts": {
      "get": {
        "tags": ["Admin"], "operationId": "listMerchantAccounts", "security": [{"AdminBearer": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantFilter"}],
        "responses": {"200": {"description": "Merchant accounts", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/MerchantAccount"}}}}}, "403": {"$ref": "#/components/responses/Problem"}}
      },
      "post": {
        "tags": ["Admin"], "operationId": "createMerchantAccount", "security": [{"AdminBearer": []}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateMerchantAccount"}}}},
        "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MerchantAccount"}}}}, "400": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/merchant-accounts/{id}": {
      "get": {
        "tags": ["Admin"], "operationId": "getMerchantAccount", "security": [{"AdminBearer": []}],
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}},
          {"name": "tenant_id", "in": "query", "required": true, "schema": {"type": "string"}}
        ],
        "responses": {"200": {"description": "Merchant account with non-secret provider fields", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MerchantAccountDetail"}}}}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}}
      },
      "put": {
        "tags": ["Admin"], "operationId": "updateMerchantAccount", "security": [{"AdminBearer": []}],
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}},
          {"name": "tenant_id", "in": "query", "required": true, "schema": {"type": "string"}}
        ],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateMerchantAccount"}}}},
        "responses": {"200": {"description": "Updated merchant account", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MerchantAccountDetail"}}}}, "400": {"$ref": "#/components/responses/Problem"}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/merchant-accounts/{id}/test-connection": {
      "post": {
        "tags": ["Admin"], "operationId": "testMerchantConnection", "security": [{"AdminBearer": []}],
        "parameters": [
          {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}},
          {"name": "tenant_id", "in": "query", "required": true, "schema": {"type": "string"}}
        ],
        "responses": {"200": {"description": "Provider reachable", "content": {"application/json": {"schema": {"type": "object", "required": ["ok"], "properties": {"ok": {"const": true}}}}}}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}, "502": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/invoices": {
      "get": {
        "tags": ["Admin"], "operationId": "listInvoices", "security": [{"AdminBearer": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantFilter"}],
        "responses": {"200": {"description": "Invoices", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Invoice"}}}}}, "403": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/invoices/{id}": {
      "get": {
        "tags": ["Admin"], "operationId": "getAdminInvoice", "security": [{"AdminBearer": []}],
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}, {"$ref": "#/components/parameters/TenantFilter"}],
        "responses": {"200": {"description": "Invoice", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invoice"}}}}, "403": {"$ref": "#/components/responses/Problem"}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/dashboard": {
      "get": {
        "tags": ["Admin"], "operationId": "adminDashboard", "security": [{"AdminBearer": []}],
        "responses": {"200": {"description": "Payment summary", "content": {"application/json": {"schema": {"type": "object"}}}}, "403": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/health": {
      "get": {
        "tags": ["Admin"], "operationId": "adminHealth", "security": [{"AdminBearer": []}],
        "responses": {"200": {"description": "Backend, database, provider API, and merchant browser-session health", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/HealthCheck"}}}}}, "403": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/qris-templates": {
      "get": {
        "tags": ["Admin"], "operationId": "listQRISTemplates", "security": [{"AdminBearer": []}],
        "responses": {"200": {"description": "Stored static QRIS templates", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/QRISTemplate"}}}}}}
      },
      "post": {
        "tags": ["Admin"], "operationId": "createQRISTemplate", "security": [{"AdminBearer": []}],
        "requestBody": {"required": true, "content": {"multipart/form-data": {"schema": {"type": "object", "required": ["image"], "properties": {"name": {"type": "string"}, "tenant_id": {"type": "string"}, "access_scope": {"type": "string", "enum": ["all_tenants", "selected_tenant"]}, "static_to_dynamic": {"type": "boolean"}, "max_requests_per_minute": {"type": "integer", "minimum": 1, "maximum": 10000}, "image": {"type": "string", "contentEncoding": "binary"}}}}}},
        "responses": {"201": {"description": "Decoded and stored template", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QRISTemplate"}}}}, "400": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/qris-templates/{id}/image": {
      "get": {
        "tags": ["Admin"], "operationId": "qrisTemplateImage", "security": [{"AdminBearer": []}],
        "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}],
        "responses": {"200": {"description": "Original uploaded QRIS image", "content": {"image/png": {"schema": {"type": "string", "contentEncoding": "binary"}}, "image/jpeg": {"schema": {"type": "string", "contentEncoding": "binary"}}}}, "404": {"$ref": "#/components/responses/Problem"}}
      }
    },
    "/admin/global-transactions": {
      "get": {
        "tags": ["Admin"], "operationId": "listGlobalTransactions", "security": [{"AdminBearer": []}],
        "parameters": [{"$ref": "#/components/parameters/TenantFilter"}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 500, "default": 100}}],
        "responses": {"200": {"description": "Merchant history and QRIS Test validation lifecycle", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/GlobalTransactionLog"}}}}}, "403": {"$ref": "#/components/responses/Problem"}}
      }
    },
