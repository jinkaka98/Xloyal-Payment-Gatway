name: xloyal

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xloyal}
      POSTGRES_USER: ${POSTGRES_USER:-xloyal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy-tidakdepploykedoscker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./deploy-tidakdepploykedoscker/postgres/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy-tidakdepploykedoscker/backend/Dockerfile
      target: api
    environment: &backend-env
      DATABASE_URL: postgres://${POSTGRES_USER:-xloyal}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-xloyal}?sslmode=disable
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_TOKENS_JSON: ${ADMIN_TOKENS_JSON:-{}}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy-tidakdepploykedoscker/backend/Dockerfile
      target: worker
    environment:
      <<: *backend-env
      CAMOUFOX_CHECKER_CMD: ${CAMOUFOX_CHECKER_CMD:-node /app/camofox_browser_checker.mjs}
      CAMOFOX_BROWSER_URL: http://camofox-browser:9377
      CAMOFOX_BROWSER_API_KEY: ${CAMOFOX_BROWSER_API_KEY}
      CAMOUFOX_CREDENTIAL_FILE: ${CAMOUFOX_CREDENTIAL_FILE:-}
      WEBWRIGHT_PORTAL_URL: ${WEBWRIGHT_PORTAL_URL:-https://merchant.qris.interactive.co.id}
      WEBWRIGHT_HISTORY_PATH: ${WEBWRIGHT_HISTORY_PATH:-/v2/m/kontenr.php?idir=pages/historytrx.php}
      WEBWRIGHT_TRANSACTION_ROW_SELECTOR: ${WEBWRIGHT_TRANSACTION_ROW_SELECTOR:-[data-transaction-row]}
      WEBWRIGHT_REFERENCE_SELECTOR: ${WEBWRIGHT_REFERENCE_SELECTOR:-[data-field='reference']}
      WEBWRIGHT_AMOUNT_SELECTOR: ${WEBWRIGHT_AMOUNT_SELECTOR:-[data-field='amount']}
      WEBWRIGHT_STATUS_SELECTOR: ${WEBWRIGHT_STATUS_SELECTOR:-[data-field='status']}
      WEBWRIGHT_PAID_AT_SELECTOR: ${WEBWRIGHT_PAID_AT_SELECTOR:-[data-field='paid_at']}
      WEBWRIGHT_PROFILE_DIR: ${WEBWRIGHT_PROFILE_DIR:-/var/lib/xloyal/webwright-profiles}
      WEBWRIGHT_BROWSER_MODE: ${WEBWRIGHT_BROWSER_MODE:-cloak_persistent}
      WEBWRIGHT_HEADLESS: ${WEBWRIGHT_HEADLESS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      camofox-browser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof worker >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  camofox-browser:
    build:
      context: ./backend/tools/camofox-browser
      dockerfile: Dockerfile
    environment:
      CAMOFOX_HOST: 0.0.0.0
      CAMOFOX_PORT: "9377"
      CAMOFOX_AUTH_MODE: required
      CAMOFOX_API_KEY: ${CAMOFOX_BROWSER_API_KEY}
      CAMOFOX_PROFILES_DIR: /home/node/.camofox/profiles
    expose:
      - "9377"
    volumes:
      - merchant_browser_profiles:/home/node/.camofox
    restart: unless-stopped

  neko:
    profiles: ["neko"]
    image: ghcr.io/m1k1o/neko/chromium:sha-395ca1a6f62b7b0e270e654d366a2d57b8042efd
    shm_size: "2gb"
    environment:
      NEKO_SERVER_BIND: 0.0.0.0:8080
      NEKO_DESKTOP_SCREEN: ${NEKO_DESKTOP_SCREEN:-1440x900@30}
      NEKO_MEMBER_PROVIDER: multiuser
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_ADMIN_PASSWORD:-change-neko-admin-password}
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_USER_PASSWORD:-change-neko-user-password}
      NEKO_SESSION_COOKIE_ENABLED: "true"
      NEKO_SESSION_COOKIE_SECURE: ${NEKO_COOKIE_SECURE:-false}
      NEKO_SESSION_MERCIFUL_RECONNECT: "true"
      NEKO_WEBRTC_ICELITE: "true"
      NEKO_WEBRTC_EPR: ${NEKO_WEBRTC_PORT:-52000}
      NEKO_WEBRTC_NAT1TO1: ${NEKO_NAT1TO1:-127.0.0.1}
    ports:
      - "${NEKO_HTTP_PORT:-3001}:8080"
      - "${NEKO_WEBRTC_PORT:-52000}:${NEKO_WEBRTC_PORT:-52000}/udp"
    volumes:
      - neko_browser_profile:/home/neko/.config/chromium
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy-tidakdepploykedoscker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      INTERNAL_API_URL: http://api:8080
      NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_CONSOLE_EMAIL: ${ADMIN_CONSOLE_EMAIL:-admin@xloyal.id}
      ADMIN_CONSOLE_PASSWORD: ${ADMIN_CONSOLE_PASSWORD}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET}
      CONSOLE_COOKIE_SECURE: ${CONSOLE_COOKIE_SECURE:-false}
      NEKO_PUBLIC_URL: ${NEKO_PUBLIC_URL:-http://localhost:3001}
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  merchant_browser_profiles:
  neko_browser_profile:

